<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Personal Page{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-indigo-200">
                    U
                </div>
                <span class="font-bold text-slate-900 tracking-tight">UBBG</span>
            </div>
            <nav class="flex items-center space-x-1">
                <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-50 transition-all">Home</a>
                <a href="/about" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-50 transition-all">About</a>
                <a href="/greet/Haykal" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-50 transition-all">Greet Test</a>
                <a href="/contact" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 shadow-md shadow-indigo-100 transition-all ml-2">Contact</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-12 flex flex-col justify-center items-center">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200 bg-white py-6">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs text-slate-400">
            &copy; 2026 Faculty of Computer Science &bull; Universitas Bina Bangsa Getsempena (UBBG)
        </div>
    </footer>

</body>
</html>
