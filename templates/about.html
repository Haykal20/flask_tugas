{% extends 'base.html' %}
{% block title %}About Me{% endblock %}
{% block content %}
<div class="w-full max-w-2xl bg-white rounded-2xl border border-slate-100 p-8 md:p-12 shadow-xl shadow-slate-200/50 transform transition-all duration-300 hover:shadow-2xl">
    <div class="flex items-center space-x-4 mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-violet-50 text-violet-600 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Student Profile</h1>
            <p class="text-xs text-slate-400">Informasi Program Studi & Hobi</p>
        </div>
    </div>
    
    <div class="bg-slate-50 border border-slate-200/60 rounded-xl p-6 shadow-inner text-base md:text-lg text-slate-700 leading-relaxed font-medium">
        I am a Computer Science student at UBBG. I enjoy <span class="text-violet-600 font-bold">{{ hobi }}</span>.
    </div>

    <div class="mt-8 grid grid-cols-2 gap-4">
        <div class="p-4 rounded-xl bg-slate-50/50 border border-slate-200/40">
            <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Institusi</span>
            <span class="text-xs font-bold text-slate-700">Universitas Bina Bangsa Getsempena</span>
        </div>
        <div class="p-4 rounded-xl bg-slate-50/50 border border-slate-200/40">
            <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Fakultas</span>
            <span class="text-xs font-bold text-slate-700">Faculty of Computer Science</span>
        </div>
    </div>
</div>
{% endblock %}
